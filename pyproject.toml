[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "numcompute-stream"
version = "0.1.0"
description = "A streaming machine learning framework built on NumPy"
requires-python = ">=3.14"
dependencies = [
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["numcompute_stream*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=numcompute_stream --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["numcompute_stream"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
